# YOLO26m-P2+C2PSA for four-scale end-to-end oriented-object detection.
#
# Outputs: P2/4, P3/8, P4/16 and P5/32.
# The graph keeps the YOLO26 SPPF/C2PSA backbone and adds a P2 path for dense
# small components. The OBB26 head is therefore connected to four scales.
#
# This configuration requires an Ultralytics runtime that exposes YOLO26 and
# OBB26. See src/yolo_p2_c2psa/transfer.py for pretrained-weight remapping.

nc: 6
scale: m
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10: P5 attention

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12
  - [-1, 2, C3k2, [512, True]] # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15
  - [-1, 2, C3k2, [256, True]] # 16-P3/8
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18
  # Keep P2 at 256 channels to preserve the official OBB26 head width.
  - [-1, 2, C3k2, [256, True]] # 19-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21
  - [-1, 2, C3k2, [256, True]] # 22-P3/8
  - [-1, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24
  - [-1, 2, C3k2, [512, True]] # 25-P4/16
  - [-1, 1, Conv, [512, 3, 2]] # 26
  - [[-1, 10], 1, Concat, [1]] # 27
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 28-P5/32
  - [[19, 22, 25, 28], 1, OBB26, [nc, 1]] # 29: P2-P5 OBB26 head

